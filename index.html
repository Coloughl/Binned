  <style>
    :root {
      --paper: #faf7f0;
      --surface: #ffffff;
      --ink: #18181b;
      --ink-muted: #52525b;
      --rule: #e4dfd3;
      --accent: #0f766e;
      --accent-soft: #ccfbf1;
      --warn: #d97706;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --serif: 'Bangers', cursive, sans-serif;
      --sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
    }

    .tabular { font-variant-numeric: tabular-nums; font-family: var(--mono); }

    /* Layout */
    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: var(--surface);
      border-right: 2px solid var(--ink);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--rule);
    }

    .brand-logo {
      width: 68px;
      height: 68px;
      border-radius: 14px;
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      object-fit: cover;
      margin-bottom: 8px;
    }

    .brand-title {
      font-family: var(--serif);
      font-size: 28px;
      letter-spacing: 1px;
      line-height: 1;
      color: var(--ink);
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 12px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: all 0.12s ease;
    }

    .nav-btn:hover {
      background: var(--paper);
    }

    .nav-btn.active {
      background: var(--accent-soft);
      border-color: var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      color: var(--ink);
    }

    .badge {
      background: var(--ink);
      color: #fff;
      font-family: var(--mono);
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 999px;
    }

    .main {
      flex: 1;
      padding: 28px 32px;
      max-width: 1120px;
      margin: 0 auto;
      width: 100%;
    }

    /* Header */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--rule);
    }

    .page-title {
      font-family: var(--serif);
      font-size: 32px;
      letter-spacing: 0.8px;
      margin: 0;
      line-height: 1.1;
    }

    .page-meta {
      font-size: 13px;
      color: var(--ink-muted);
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* Buttons & Inputs */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 2px solid var(--ink);
      background: var(--surface);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--ink);
    }

    .btn:active:not(:disabled) {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--ink);
      color: #fff;
    }

    .btn-accent {
      background: var(--accent);
      color: #fff;
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    .btn-ghost {
      border-color: transparent;
      background: transparent;
      box-shadow: none;
      color: var(--ink-muted);
    }

    .btn-ghost:hover {
      background: var(--rule);
      color: var(--ink);
      transform: none;
      box-shadow: none;
    }

    .btn-danger-outline {
      border-color: var(--danger);
      color: var(--danger);
      box-shadow: 2px 2px 0 var(--danger);
    }

    input, select, textarea {
      font-family: var(--sans);
      font-size: 13px;
      padding: 8px 10px;
      border: 2px solid var(--ink);
      border-radius: 7px;
      background: var(--surface);
      color: var(--ink);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Panels & Grids */
    .panel {
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 3px 3px 0 var(--ink);
      margin-bottom: 18px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .panel-title {
      font-family: var(--serif);
      font-size: 22px;
      letter-spacing: 0.5px;
      margin: 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: 2px 2px 0 var(--ink);
    }

    .stat-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-muted);
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      margin: 4px 0 2px;
    }

    .stat-sub {
      font-size: 12px;
      color: var(--ink-muted);
    }

    .bins-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    .bin-card {
      background: var(--paper);
      border: 1.5px solid var(--ink);
      border-radius: 9px;
      padding: 12px 14px;
    }

    .bar-track {
      height: 8px;
      background: var(--rule);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid var(--ink);
    }

    .bar-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.2s ease;
    }

    .bar-fill.warn { background: var(--warn); }
    .bar-fill.danger { background: var(--danger); }

    /* Queue Items */
    .queue-item {
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: 11px;
      padding: 14px 18px;
      margin-bottom: 12px;
      box-shadow: 3px 3px 0 var(--ink);
    }

    .queue-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .queue-merchant {
      font-weight: 800;
      font-size: 16px;
    }

    .queue-date {
      font-size: 12px;
      color: var(--ink-muted);
    }

    .queue-amount {
      font-size: 18px;
      font-weight: 700;
    }

    .bin-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .bin-pill {
      padding: 5px 11px;
      border-radius: 999px;
      border: 1.5px solid var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .bin-pill:hover {
      background: var(--accent);
      color: #fff;
    }

    /* Two Column Plan */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 18px;
      align-items: start;
    }

    .paycheck-card {
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 3px 3px 0 var(--ink);
      margin-bottom: 14px;
    }

    .split-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 7px;
      margin-bottom: 6px;
    }

    /* Table */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--rule);
      text-align: left;
    }

    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-muted);
    }

    .num { text-align: right; }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: var(--paper);
      border: 1px solid var(--ink);
    }

    .tag-paid {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Month Switcher */
    .month-bar {
      display: inline-flex;
      align-items: center;
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: 8px;
      box-shadow: 2px 2px 0 var(--ink);
      overflow: hidden;
    }

    .month-bar button {
      border: none;
      background: transparent;
      padding: 6px 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .month-bar button:hover {
      background: var(--paper);
    }

    .month-label {
      padding: 0 10px;
      font-weight: 800;
      font-size: 13px;
    }

    /* Sync indicator */
    .sync-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1.5px solid var(--ink);
      background: var(--paper);
      font-size: 12px;
      font-weight: 700;
    }

    .sync-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink-muted);
      margin-right: 6px;
    }

    .sync-dot.online { background: var(--accent); }
    .sync-dot.syncing { background: var(--warn); }

    /* Modal */
    .hidden { display: none !important; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 24, 27, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal {
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: 14px;
      padding: 22px 24px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 5px 5px 0 var(--ink);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--ink);
      color: #fff;
      padding: 10px 16px;
      border-radius: 9px;
      font-weight: 600;
      font-size: 13px;
      box-shadow: 3px 3px 0 var(--accent);
      z-index: 200;
    }

    @media (max-width: 820px) {
      .app { flex-direction: column; }
      .sidebar {
        width: 100%;
        height: auto;
        position: static;
        border-right: none;
        border-bottom: 2px solid var(--ink);
        padding: 12px 16px;
      }
      .brand {
        flex-direction: row;
        text-align: left;
        gap: 12px;
        padding-bottom: 10px;
        margin-bottom: 10px;
      }
      .brand-logo { width: 44px; height: 44px; margin-bottom: 0; }
      .nav-list { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
      .nav-btn { width: auto; white-space: nowrap; }
      .main { padding: 18px 16px; }
      .two-col { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>
    const STORAGE_KEY = 'binned_ledger_v2';
    const CLOUD_CFG_KEY = 'binned_supabase_cfg_v1';
    const SIMPLEFIN_CFG_KEY = 'binned_simplefin_cfg_v1';

    function getCurrentMonthKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    const DEFAULT_STATE = {
      defaultMonthlyIncome: 3300,
      monthlyIncomes: {
        '2026-11': 3300
      },
      bins: [
        { id: 'mtg', name: 'MTG Cards', budget: 120 },
        { id: 'beer', name: 'Beer', budget: 80 },
        { id: 'groceries', name: 'Groceries', budget: 450 },
        { id: 'eating_out', name: 'Eating Out', budget: 200 },
        { id: 'transport', name: 'Transport', budget: 160 },
        { id: 'home', name: 'Home', budget: 150 },
        { id: 'fun', name: 'Fun', budget: 120 }
      ],
      transactions: [
        { id: 't1', date: '2026-11-17', merchant: 'Card Kingdom', amount: 42.50, binId: null },
        { id: 't2', date: '2026-11-16', merchant: 'Keweenaw Brewing Co', amount: 18.50, binId: null },
        { id: 't3', date: '2026-11-16', merchant: 'Econo Foods', amount: 84.20, binId: null },
        { id: 't4', date: '2026-11-12', merchant: 'Local Game Store - Draft', amount: 25.00, binId: 'mtg' },
        { id: 't5', date: '2026-11-10', merchant: 'Econo Foods', amount: 112.40, binId: 'groceries' },
        { id: 't6', date: '2026-11-08', merchant: 'Shell Station', amount: 44.10, binId: 'transport' }
      ],
      bills: [
        { id: 'b1', name: 'Rent', amount: 1150, dueDate: '2026-12-01', recurring: true, paid: false },
        { id: 'b2', name: 'Electric & Gas', amount: 135, dueDate: '2026-11-24', recurring: true, paid: false },
        { id: 'b3', name: 'Internet', amount: 65, dueDate: '2026-11-28', recurring: true, paid: false },
        { id: 'b4', name: 'Auto Insurance', amount: 118, dueDate: '2026-11-20', recurring: true, paid: false }
      ],
      paychecks: [
        {
          id: 'p1',
          month: '2026-11',
          label: 'Paycheck #1 (Nov 15)',
          amount: 1650,
          allocations: [
            { id: 'a1', targetType: 'bill', targetId: 'b1', amount: 575 },
            { id: 'a2', targetType: 'bill', targetId: 'b4', amount: 118 },
            { id: 'a3', targetType: 'bin', targetId: 'groceries', amount: 225 }
          ]
        },
        {
          id: 'p2',
          month: '2026-11',
          label: 'Paycheck #2 (Nov 30)',
          amount: 1650,
          allocations: [
            { id: 'a4', targetType: 'bill', targetId: 'b1', amount: 575 }
          ]
        }
      ],
      debts: [
        { id: 'd1', name: 'Chase Sapphire Card', balance: 2400, apr: 22.99, payment: 150 },
        { id: 'd2', name: 'Auto Loan', balance: 9800, apr: 5.49, payment: 295 }
      ]
    };

    let state = loadState();
    let cloudCfg = loadCloudCfg();
    let simpleFinCfg = loadSimpleFinCfg();
    let currentTab = 'queue';
    let selectedMonth = getCurrentMonthKey();
    let filterBin = 'all';
    let searchQuery = '';
    let extraDebtPayment = 0;
    let isSyncingBank = false;
    let cloudSyncStatus = isCloudConfigured() ? 'online' : 'local';

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (typeof parsed.defaultMonthlyIncome !== 'number') parsed.defaultMonthlyIncome = 0;
          if (!parsed.monthlyIncomes) parsed.monthlyIncomes = {};
          return parsed;
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    function loadCloudCfg() {
      try {
        const raw = localStorage.getItem(CLOUD_CFG_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { url: '', key: '', ledgerKey: '' };
    }

    function loadSimpleFinCfg() {
      try {
        const raw = localStorage.getItem(SIMPLEFIN_CFG_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { accessUrl: '', days: 14 };
    }

    function saveSimpleFinCfg(cfg) {
      simpleFinCfg = {
        accessUrl: String(cfg.accessUrl || '').trim(),
        days: Math.max(1, Math.min(90, Number(cfg.days) || 14))
      };
      localStorage.setItem(SIMPLEFIN_CFG_KEY, JSON.stringify(simpleFinCfg));
    }

    function sanitizeUrl(raw) {
      let s = String(raw || '').trim();
      const mdMatch = s.match(/\[(https?:\/\/[^\]]+)\]/);
      if (mdMatch) s = mdMatch[1];
      return s.replace(/\/$/, '');
    }

    function saveCloudCfg(cfg) {
      cloudCfg = {
        url: sanitizeUrl(cfg.url),
        key: String(cfg.key || '').trim(),
        ledgerKey: String(cfg.ledgerKey || '').trim()
      };
      localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cloudCfg));
      updateSyncUI();
    }

    function saveState(skipCloud = false) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateBadges();
      if (!skipCloud && isCloudConfigured()) {
        pushToCloud();
      }
    }

    function isCloudConfigured() {
      return Boolean(cloudCfg && cloudCfg.url && cloudCfg.key && cloudCfg.ledgerKey);
    }

    function isSimpleFinConfigured() {
      return Boolean(isCloudConfigured() && simpleFinCfg && simpleFinCfg.accessUrl);
    }

    function getSupabaseHeaders(extra = {}) {
      const headers = { 'apikey': cloudCfg.key, ...extra };
      if (cloudCfg.key && cloudCfg.key.startsWith('eyJ')) {
        headers['Authorization'] = `Bearer ${cloudCfg.key}`;
      }
      return headers;
    }

    function updateSyncUI(statusOverride) {
      if (!isCloudConfigured()) {
        cloudSyncStatus = 'local';
      } else if (statusOverride) {
        cloudSyncStatus = statusOverride;
      } else if (cloudSyncStatus === 'local') {
        cloudSyncStatus = 'online';
      }

      const dot = document.getElementById('sync-dot');
      const txt = document.getElementById('sync-text');
      if (!dot || !txt) return;

      if (cloudSyncStatus === 'local') {
        dot.className = 'sync-dot';
        txt.textContent = 'Local Only';
      } else if (cloudSyncStatus === 'syncing') {
        dot.className = 'sync-dot syncing';
        txt.textContent = 'Syncing...';
      } else if (cloudSyncStatus === 'error') {
        dot.className = 'sync-dot';
        txt.textContent = 'Sync Error';
      } else {
        dot.className = 'sync-dot online';
        txt.textContent = 'Cloud Synced';
      }
    }

    async function pushToCloud() {
      if (!isCloudConfigured()) return;
      updateSyncUI('syncing');
      try {
        const cleanUrl = sanitizeUrl(cloudCfg.url);
        const res = await fetch(`${cleanUrl}/rest/v1/rpc/save_ledger`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({
            p_key: cloudCfg.ledgerKey,
            p_payload: state
          })
        });
        if (!res.ok) throw new Error('Push failed: ' + res.status);
        updateSyncUI('online');
      } catch (e) {
        updateSyncUI('error');
      }
    }

    async function pullFromCloud(silent = false) {
      if (!isCloudConfigured()) return;
      updateSyncUI('syncing');
      try {
        const cleanUrl = sanitizeUrl(cloudCfg.url);
        const res = await fetch(`${cleanUrl}/rest/v1/rpc/get_ledger`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ p_key: cloudCfg.ledgerKey })
        });
        if (!res.ok) throw new Error('Pull failed: ' + res.status);
        const payload = await res.json();
        if (payload) {
          state = payload;
          if (typeof state.defaultMonthlyIncome !== 'number') state.defaultMonthlyIncome = 0;
          if (!state.monthlyIncomes) state.monthlyIncomes = {};
          saveState(true);
          render();
          if (!silent) showToast('Synced latest ledger from cloud.');
        } else {
          await pushToCloud();
          if (!silent) showToast('Initialized new cloud ledger.');
        }
        updateSyncUI('online');
      } catch (e) {
        updateSyncUI('error');
        if (!silent) showToast('Could not connect to Supabase. Check URL, Key, and SQL setup.');
      }
    }

    async function syncSimpleFinNow() {
      if (!isSimpleFinConfigured()) {
        openSimpleFinModal();
        return;
      }
      if (isSyncingBank) return;
      isSyncingBank = true;
      render();
      try {
        await pushToCloud();
        const cleanUrl = sanitizeUrl(cloudCfg.url);
        const res = await fetch(`${cleanUrl}/functions/v1/sync-simplefin`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({
            action: 'sync',
            ledger_key: cloudCfg.ledgerKey,
            access_url: simpleFinCfg.accessUrl,
            days: simpleFinCfg.days || 14
          })
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          throw new Error(data.error || 'SimpleFIN sync failed');
        }
        if (data.added > 0) {
          await pullFromCloud(true);
          showToast(`Imported ${data.added} new bank purchase${data.added === 1 ? '' : 's'}!`);
        } else {
          showToast('Bank feed up to date — no new purchases.');
        }
      } catch (e) {
        showToast('SimpleFIN Error: ' + e.message);
      } finally {
        isSyncingBank = false;
        render();
      }
    }

    function fmt(n) {
      return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function uid(prefix = 'id') {
      return prefix + '_' + Math.random().toString(36).slice(2, 9);
    }

    function formatMonthDisplay(ym) {
      const [y, m] = ym.split('-').map(Number);
      const d = new Date(y, m - 1, 1);
      return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
    }

    function shiftMonth(delta) {
      const [y, m] = selectedMonth.split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      selectedMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      render();
    }

    function monthSwitcherHtml() {
      return `
        <div class="month-bar">
          <button title="Previous Month" onclick="shiftMonth(-1)">&larr;</button>
          <span class="month-label">${formatMonthDisplay(selectedMonth)}</span>
          <button title="Next Month" onclick="shiftMonth(1)">&rarr;</button>
        </div>
      `;
    }

    function getExpectedIncomeForMonth(ym) {
      if (state.monthlyIncomes && typeof state.monthlyIncomes[ym] === 'number') {
        return state.monthlyIncomes[ym];
      }
      return Number(state.defaultMonthlyIncome || 0);
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.add('hidden'), 3600);
    }

    async function copyFieldText(inputId, label = 'Value') {
      const inp = document.getElementById(inputId);
      const val = inp ? inp.value.trim() : '';
      if (!val) {
        showToast(`Nothing in ${label} to copy yet.`);
        return;
      }
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(val);
          showToast(`${label} copied to clipboard!`);
          return;
        }
      } catch (e) {}

      const temp = document.createElement('textarea');
      temp.value = val;
      temp.setAttribute('readonly', '');
      temp.style.position = 'fixed';
      temp.style.opacity = '0';
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      temp.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        showToast(`${label} copied to clipboard!`);
      } catch (err) {
        showToast(`Could not auto-copy — tap Show and copy manually.`);
      }
      document.body.removeChild(temp);
    }

    function toggleSecretField(inputId, btn) {
      const inp = document.getElementById(inputId);
      if (!inp) return;
      if (inp.type === 'password') {
        inp.type = 'text';
        btn.textContent = 'Hide';
      } else {
        inp.type = 'password';
        btn.textContent = 'Show';
      }
    }

    function updateBadges() {
      const unbinned = state.transactions.filter(t => !t.binId).length;
      const badge = document.getElementById('queue-badge');
      badge.textContent = unbinned;
      badge.style.display = unbinned > 0 ? 'inline-block' : 'none';
    }

    // Navigation
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        render();
      });
    });

    function getBinSpentForMonth(binId, ym) {
      return state.transactions
        .filter(t => t.binId === binId && t.date && t.date.startsWith(ym))
        .reduce((sum, t) => sum + Number(t.amount), 0);
    }

    function assignBin(txId, binId) {
      const tx = state.transactions.find(t => t.id === txId);
      const bin = state.bins.find(b => b.id === binId);
      if (!tx || !bin) return;
      tx.binId = binId;
      const txMonth = (tx.date || selectedMonth).slice(0, 7);
      saveState();
      const left = bin.budget - getBinSpentForMonth(binId, txMonth);
      showToast(`Binned to ${bin.name} (${formatMonthDisplay(txMonth)}). ${fmt(left)} left.`);
      render();
    }

    function unbinTx(txId) {
      const tx = state.transactions.find(t => t.id === txId);
      if (!tx) return;
      tx.binId = null;
      saveState();
      showToast('Moved back to To Bin queue.');
      render();
    }

    function deleteTx(txId) {
      state.transactions = state.transactions.filter(t => t.id !== txId);
      saveState();
      render();
    }

    function clearSampleData() {
      if (!confirm('Clear all sample transactions, bills, paychecks, and debts so you can start with a clean slate? (Your bin categories will be kept.)')) return;
      state.transactions = [];
      state.bills = [];
      state.paychecks = [];
      state.debts = [];
      state.defaultMonthlyIncome = 0;
      state.monthlyIncomes = {};
      saveState();
      showToast('Cleared all sample data. Ready for your real numbers!');
      render();
    }

    // Render Router
    function render() {
      updateBadges();
      const main = document.getElementById('main-content');
      if (currentTab === 'queue') renderQueue(main);
      else if (currentTab === 'overview') renderOverview(main);
      else if (currentTab === 'plan') renderPlan(main);
      else if (currentTab === 'debts') renderDebts(main);
      else if (currentTab === 'settings') renderSettings(main);
      updateSyncUI();
    }

    // 1. TO BIN QUEUE
    function renderQueue(main) {
      const queue = state.transactions
        .filter(t => !t.binId)
        .sort((a, b) => b.date.localeCompare(a.date));

      main.innerHTML = `
        <div class="page-header">
          <div>
            <h2 class="page-title">To Bin Queue</h2>
            <div class="page-meta">${queue.length} purchase${queue.length === 1 ? '' : 's'} waiting for a bin (auto-filed by purchase date)</div>
          </div>
          <div class="header-actions">
            ${isSimpleFinConfigured() ? `
              <button class="btn btn-accent" onclick="syncSimpleFinNow()" ${isSyncingBank ? 'disabled' : ''}>
                ${isSyncingBank ? 'Pulling Bank...' : 'Sync Bank Now'}
              </button>
            ` : ''}
            <button class="btn" onclick="openChaseImportModal()">Import CSV / Paste</button>
            <button class="btn btn-primary" onclick="openAddPurchaseModal()">+ Log Purchase</button>
          </div>
        </div>

        ${queue.length === 0 ? `
          <div class="panel" style="text-align:center; padding: 36px 20px;">
            <div style="font-family:var(--serif); font-size:24px; margin-bottom:6px;">All caught up</div>
            <div style="color:var(--ink-muted); margin-bottom:16px;">Every logged purchase has been assigned to a bin.</div>
            <div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap;">
              ${isSimpleFinConfigured() ? `<button class="btn btn-accent" onclick="syncSimpleFinNow()" ${isSyncingBank ? 'disabled' : ''}>${isSyncingBank ? 'Pulling Bank...' : 'Pull New Bank Purchases'}</button>` : ''}
              <button class="btn btn-primary" onclick="openAddPurchaseModal()">+ Log a Purchase</button>
            </div>
          </div>
        ` : queue.map(tx => `
          <div class="queue-item">
            <div class="queue-top">
              <div>
                <div class="queue-merchant">${escapeHtml(tx.merchant)}</div>
                <div class="queue-date">
                  ${tx.date} &bull; Files into <strong>${formatMonthDisplay((tx.date || selectedMonth).slice(0, 7))}</strong>
                  ${tx.externalId ? ' &bull; <span class="tag">SimpleFIN</span>' : ''}
                </div>
              </div>
              <div style="display:flex; align-items:center; gap:10px;">
                <span class="queue-amount tabular">${fmt(tx.amount)}</span>
                <button class="btn btn-sm btn-ghost" title="Delete" onclick="deleteTx('${tx.id}')">&times;</button>
              </div>
            </div>
            <div class="bin-pills">
              ${state.bins.map(b => `
                <button class="bin-pill" onclick="assignBin('${tx.id}', '${b.id}')">${escapeHtml(b.name)}</button>
              `).join('')}
            </div>
          </div>
        `).join('')}
      `;
    }

    // 2. OVERVIEW LEDGER
    function renderOverview(main) {
      const expectedIncome = getExpectedIncomeForMonth(selectedMonth);
      const totalBudget = state.bins.reduce((s, b) => s + Number(b.budget), 0);
      const monthBillsTotal = state.bills
        .filter(b => b.recurring || (b.dueDate && b.dueDate.startsWith(selectedMonth)))
        .reduce((s, b) => s + Number(b.amount), 0);

      const binnedTxs = state.transactions.filter(t => t.binId && t.date && t.date.startsWith(selectedMonth));
      const totalSpent = binnedTxs.reduce((s, t) => s + Number(t.amount), 0);
      const plannedOutflow = totalBudget + monthBillsTotal;
      const projectedSavings = expectedIncome - plannedOutflow;
      const actualLeftFromIncome = expectedIncome - (totalSpent + monthBillsTotal);

      const filtered = binnedTxs
        .filter(t => filterBin === 'all' || t.binId === filterBin)
        .filter(t => !searchQuery || t.merchant.toLowerCase().includes(searchQuery.toLowerCase()))
        .sort((a, b) => b.date.localeCompare(a.date));

      main.innerHTML = `
        <div class="page-header">
          <div>
            <h2 class="page-title">Spending Overview</h2>
            <div class="page-meta">Monthly income, bin budgets &amp; historical ledger</div>
          </div>
          <div class="header-actions">
            ${monthSwitcherHtml()}
            <button class="btn" onclick="openIncomeModal()">Set Income</button>
            <button class="btn" onclick="openEditBinsModal()">Edit Bins</button>
            <button class="btn btn-primary" onclick="openAddPurchaseModal()">+ Log Purchase</button>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-box" style="cursor:pointer;" onclick="openIncomeModal()" title="Click to edit expected monthly income">
            <div class="stat-label">Expected Income (${formatMonthDisplay(selectedMonth)})</div>
            <div class="stat-value tabular" style="color:var(--accent);">${fmt(expectedIncome)}</div>
            <div class="stat-sub">Click to edit monthly income</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Planned Bills + Bins</div>
            <div class="stat-value tabular">${fmt(plannedOutflow)}</div>
            <div class="stat-sub">Bills ${fmt(monthBillsTotal)} + Bins ${fmt(totalBudget)}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Binned Spent (${formatMonthDisplay(selectedMonth)})</div>
            <div class="stat-value tabular">${fmt(totalSpent)}</div>
            <div class="stat-sub">${fmt(totalBudget - totalSpent)} left in bin budgets</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Projected Monthly Margin</div>
            <div class="stat-value tabular" style="color:${projectedSavings < 0 ? 'var(--danger)' : 'var(--accent)'}">
              ${fmt(projectedSavings)}
            </div>
            <div class="stat-sub">Actual pace: ${fmt(actualLeftFromIncome)}</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h3 class="panel-title">Bins Breakdown — ${formatMonthDisplay(selectedMonth)}</h3>
            <button class="btn btn-sm" onclick="openEditBinsModal()">+ Add / Edit Bins</button>
          </div>
          <div class="bins-grid">
            ${state.bins.map(b => {
              const spent = getBinSpentForMonth(b.id, selectedMonth);
              const pct = Math.min(100, Math.round((spent / (b.budget || 1)) * 100));
              const fillClass = spent > b.budget ? 'danger' : pct >= 80 ? 'warn' : '';
              return `
                <div class="bin-card">
                  <div style="display:flex; justify-content:space-between; font-weight:700;">
                    <span>${escapeHtml(b.name)}</span>
                    <span class="tabular">${fmt(spent)} / ${fmt(b.budget)}</span>
                  </div>
                  <div class="bar-track">
                    <div class="bar-fill ${fillClass}" style="width:${pct}%"></div>
                  </div>
                  <div style="font-size:12px; color:var(--ink-muted); margin-top:6px;">
                    ${spent > b.budget ? `${fmt(spent - b.budget)} over budget` : `${fmt(b.budget - spent)} remaining`}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h3 class="panel-title">Binned Ledger — ${formatMonthDisplay(selectedMonth)}</h3>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <input type="text" placeholder="Search merchant..." value="${escapeHtml(searchQuery)}" oninput="searchQuery=this.value; renderOverview(document.getElementById('main-content'))" />
              <select onchange="filterBin=this.value; renderOverview(document.getElementById('main-content'))">
                <option value="all">All Bins</option>
                ${state.bins.map(b => `<option value="${b.id}" ${filterBin === b.id ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Merchant</th>
                  <th>Bin</th>
                  <th class="num">Amount</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${filtered.length === 0 ? `<tr><td colspan="5" style="text-align:center; color:var(--ink-muted); padding:20px;">No binned transactions recorded for ${formatMonthDisplay(selectedMonth)}.</td></tr>` :
                  filtered.map(t => {
                    const bin = state.bins.find(b => b.id === t.binId);
                    return `
                      <tr>
                        <td class="tabular">${t.date}</td>
                        <td><strong>${escapeHtml(t.merchant)}</strong></td>
                        <td><span class="tag">${bin ? escapeHtml(bin.name) : 'Unknown'}</span></td>
                        <td class="num tabular">${fmt(t.amount)}</td>
                        <td class="num">
                          <button class="btn btn-sm btn-ghost" onclick="unbinTx('${t.id}')">Unbin</button>
                        </td>
                      </tr>
                    `;
                  }).join('')
                }
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // 3. PLAN & PAYCHECK SPLITS
    function getMonthPaychecks(ym) {
      return state.paychecks.filter(p => (p.month || getCurrentMonthKey()) === ym);
    }

    function getBillCoveredTotal(billId, ym) {
      let sum = 0;
      getMonthPaychecks(ym).forEach(p => {
        p.allocations.forEach(a => {
          if (a.targetType === 'bill' && a.targetId === billId) sum += Number(a.amount);
        });
      });
      return sum;
    }

    function renderPlan(main) {
      const sortedBills = [...state.bills].sort((a, b) => a.dueDate.localeCompare(b.dueDate));
      const monthPaychecks = getMonthPaychecks(selectedMonth);
      const expectedIncome = getExpectedIncomeForMonth(selectedMonth);
      const loggedPaychecksTotal = monthPaychecks.reduce((s, p) => s + Number(p.amount), 0);

      main.innerHTML = `
        <div class="page-header">
          <div>
            <h2 class="page-title">Plan &amp; Paycheck Splits</h2>
            <div class="page-meta">
              Expected Income: <strong>${fmt(expectedIncome)}</strong> &bull; Logged Paychecks: <strong>${fmt(loggedPaychecksTotal)}</strong>
              (${fmt(expectedIncome - loggedPaychecksTotal)} unlogged)
            </div>
          </div>
          <div class="header-actions">
            ${monthSwitcherHtml()}
            <button class="btn" onclick="openIncomeModal()">Set Income</button>
            <button class="btn" onclick="openCoverageModal()">Bill Coverage</button>
            <button class="btn" onclick="openAddBillModal()">+ Add Bill</button>
            <button class="btn btn-primary" onclick="openAddPaycheckModal()">+ Add Paycheck</button>
          </div>
        </div>

        <div class="two-col">
          <div class="panel">
            <div class="panel-header">
              <h3 class="panel-title">Bills &amp; Coverage (${formatMonthDisplay(selectedMonth)})</h3>
              <button class="btn btn-sm" onclick="openCoverageModal()">Coverage</button>
            </div>
            ${sortedBills.length === 0 ? `<div style="color:var(--ink-muted);">No bills added yet.</div>` :
              sortedBills.map(b => {
                const covered = getBillCoveredTotal(b.id, selectedMonth);
                const pct = Math.min(100, Math.round((covered / (b.amount || 1)) * 100));
                return `
                  <div style="padding:12px 0; border-bottom:1px solid var(--rule);">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                      <div>
                        <strong>${escapeHtml(b.name)}</strong>
                        ${b.paid ? `<span class="tag tag-paid">Paid</span>` : ''}
                        <div style="font-size:12px; color:var(--ink-muted);">Due ${b.dueDate} ${b.recurring ? '&bull; Monthly' : '&bull; One-off'}</div>
                      </div>
                      <div style="text-align:right;">
                        <div class="tabular" style="font-weight:700;">${fmt(b.amount)}</div>
                        <div style="font-size:11px; color:var(--ink-muted);">Covered: ${fmt(covered)}</div>
                      </div>
                    </div>
                    <div class="bar-track">
                      <div class="bar-fill" style="width:${pct}%"></div>
                    </div>
                    <div style="display:flex; gap:6px; margin-top:8px;">
                      <button class="btn btn-sm" onclick="toggleBillPaid('${b.id}')">
                        ${b.paid ? 'Undo Paid' : (b.recurring ? 'Mark Paid & Roll Next Month' : 'Mark Paid')}
                      </button>
                      <button class="btn btn-sm btn-ghost" onclick="deleteBill('${b.id}')">Remove</button>
                    </div>
                  </div>
                `;
              }).join('')
            }
          </div>

          <div>
            ${monthPaychecks.length === 0 ? `
              <div class="panel">
                <div style="color:var(--ink-muted); margin-bottom:10px;">No paychecks logged for ${formatMonthDisplay(selectedMonth)} yet.</div>
                <button class="btn btn-primary" onclick="openAddPaycheckModal()">+ Add Paycheck for ${formatMonthDisplay(selectedMonth)}</button>
              </div>
            ` : monthPaychecks.map(p => {
              const assigned = p.allocations.reduce((s, a) => s + Number(a.amount), 0);
              const left = Number(p.amount) - assigned;
              return `
                <div class="paycheck-card">
                  <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;">
                    <div>
                      <div style="font-weight:700; font-size:16px;">${escapeHtml(p.label)}</div>
                      <div class="tabular" style="font-size:12px; color:var(--ink-muted);">Total: ${fmt(p.amount)}</div>
                    </div>
                    <div style="text-align:right;">
                      <div style="font-size:11px; text-transform:uppercase; color:var(--ink-muted);">Left to Assign</div>
                      <div class="tabular" style="font-size:18px; font-weight:700; color:${left < 0 ? 'var(--danger)' : 'var(--accent)'}">
                        ${fmt(left)}
                      </div>
                    </div>
                  </div>

                  <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;">
                    <button class="btn btn-sm btn-accent" onclick="coverBillsFirst('${p.id}')">Cover Bills First</button>
                    <button class="btn btn-sm" onclick="openAddSplitModal('${p.id}')">+ Add Split Line</button>
                    <button class="btn btn-sm btn-ghost" onclick="deletePaycheck('${p.id}')">Delete</button>
                  </div>

                  <div>
                    ${p.allocations.length === 0 ? `<div style="font-size:12px; color:var(--ink-muted);">No allocations yet.</div>` :
                      p.allocations.map(a => {
                        let label = 'Unknown';
                        let extraInfo = '';
                        let canCoverRest = false;
                        if (a.targetType === 'bill') {
                          const bill = state.bills.find(b => b.id === a.targetId);
                          if (bill) {
                            label = `Bill: ${bill.name}`;
                            const totalCov = getBillCoveredTotal(bill.id, selectedMonth);
                            const rem = Math.max(0, bill.amount - totalCov);
                            extraInfo = `Covered ${fmt(totalCov)} of ${fmt(bill.amount)}`;
                            if (rem > 0 && left > 0) canCoverRest = true;
                          }
                        } else {
                          const bin = state.bins.find(b => b.id === a.targetId);
                          if (bin) label = `Bin: ${bin.name}`;
                        }
                        return `
                          <div class="split-row">
                            <div>
                              <div style="font-weight:600;">${escapeHtml(label)}</div>
                              ${extraInfo ? `<div style="font-size:11px; color:var(--ink-muted);">${extraInfo}</div>` : ''}
                            </div>
                            <div style="display:flex; align-items:center; gap:6px;">
                              ${canCoverRest ? `<button class="btn btn-sm" onclick="coverRestOnLine('${p.id}', '${a.id}')">Cover rest</button>` : ''}
                              <span class="tabular" style="font-weight:700;">${fmt(a.amount)}</span>
                              <button class="btn btn-sm btn-ghost" onclick="removeSplit('${p.id}', '${a.id}')">&times;</button>
                            </div>
                          </div>
                        `;
                      }).join('')
                    }
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function toggleBillPaid(billId) {
      const bill = state.bills.find(b => b.id === billId);
      if (!bill) return;
      if (!bill.paid && bill.recurring) {
        const d = new Date(bill.dueDate + 'T00:00:00');
        d.setMonth(d.getMonth() + 1);
        bill.dueDate = d.toISOString().slice(0, 10);
        showToast(`${bill.name} marked paid and rolled to ${bill.dueDate}.`);
      } else {
        bill.paid = !bill.paid;
      }
      saveState();
      render();
    }

    function deleteBill(billId) {
      state.bills = state.bills.filter(b => b.id !== billId);
      state.paychecks.forEach(p => {
        p.allocations = p.allocations.filter(a => !(a.targetType === 'bill' && a.targetId === billId));
      });
      saveState();
      render();
    }

    function deletePaycheck(pId) {
      state.paychecks = state.paychecks.filter(p => p.id !== pId);
      saveState();
      render();
    }

    function removeSplit(pId, aId) {
      const p = state.paychecks.find(x => x.id === pId);
      if (!p) return;
      p.allocations = p.allocations.filter(a => a.id !== aId);
      saveState();
      render();
    }

    function coverRestOnLine(pId, aId) {
      const p = state.paychecks.find(x => x.id === pId);
      if (!p) return;
      const line = p.allocations.find(a => a.id === aId);
      if (!line || line.targetType !== 'bill') return;
      const bill = state.bills.find(b => b.id === line.targetId);
      if (!bill) return;

      const assigned = p.allocations.reduce((s, a) => s + Number(a.amount), 0);
      const paycheckLeft = Math.max(0, Number(p.amount) - assigned);
      const billRemaining = Math.max(0, Number(bill.amount) - getBillCoveredTotal(bill.id, selectedMonth));
      const add = Math.min(paycheckLeft, billRemaining);

      if (add > 0) {
        line.amount = Number(line.amount) + add;
        saveState();
        showToast(`Added ${fmt(add)} to cover ${bill.name}.`);
        render();
      }
    }

    function coverBillsFirst(pId) {
      const p = state.paychecks.find(x => x.id === pId);
      if (!p) return;
      let assigned = p.allocations.reduce((s, a) => s + Number(a.amount), 0);
      let left = Number(p.amount) - assigned;
      if (left <= 0) {
        showToast('No remaining funds on this paycheck.');
        return;
      }

      const sortedBills = [...state.bills].filter(b => !b.paid).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
      let addedCount = 0;

      for (const bill of sortedBills) {
        if (left <= 0) break;
        const covered = getBillCoveredTotal(bill.id, selectedMonth);
        const needed = Number(bill.amount) - covered;
        if (needed > 0) {
          const put = Math.min(left, needed);
          const existing = p.allocations.find(a => a.targetType === 'bill' && a.targetId === bill.id);
          if (existing) existing.amount = Number(existing.amount) + put;
          else p.allocations.push({ id: uid('a'), targetType: 'bill', targetId: bill.id, amount: put });
          left -= put;
          addedCount++;
        }
      }

      saveState();

    // 4. DEBTS & LOANS CALCULATOR
    function calculatePayoff(balance, apr, monthlyPayment) {
      if (balance <= 0) return { months: 0, totalInterest: 0, underwater: false, payoffDate: 'Paid off' };
      const r = (apr / 100) / 12;
      if (r > 0 && monthlyPayment <= balance * r) {
        return { months: Infinity, totalInterest: Infinity, underwater: true, payoffDate: 'Never' };
      }
      let bal = balance;
      let months = 0;
      let totalInterest = 0;
      while (bal > 0.005 && months < 1200) {
        const interest = bal * r;
        totalInterest += interest;
        bal = bal + interest - monthlyPayment;
        months++;
      }
      const d = new Date();
      d.setMonth(d.getMonth() + months);
      const payoffDate = d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
      return { months, totalInterest, underwater: false, payoffDate };
    }

    async function claimSimpleFinToken() {
      const tokenInput = document.getElementById('sf-setup-token');

      if (!setupToken) return alert('Paste your SimpleFIN Setup Token first.');

      btn.textContent = 'Claiming...';
      try {
        const cleanUrl = sanitizeUrl(cloudCfg.url);
        const res = await fetch(`${cleanUrl}/functions/v1/sync-simplefin`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ action: 'claim', setup_token: setupToken })
        });
        const data = await res.json();
        if (!res.ok || data.error || !data.access_url) {
          throw new Error(data.error || 'Could not claim token');
        }
        document.getElementById('sf-access-url').value = data.access_url;
        tokenInput.value = '';
        saveSimpleFinCfg({
          accessUrl: data.access_url,
          days: document.getElementById('sf-days').value
        });
        showToast('SimpleFIN token claimed! Copy your Access URL if you also want it on your phone.');
      } catch (e) {
        alert('Claim error: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Claim Token';
      }
    }

    function handleCsvUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

    function parsePastedChase() {
      const raw = document.getElementById('chase-paste').value.trim();
      if (!raw) return;
      const lines = raw.split(/\r?\n/);
      let added = 0;

      lines.forEach(line => {
        if (!line.trim() || /transaction date|details|description/i.test(line)) return;
        const cols = line.includes(',') ? line.split(',').map(c => c.replace(/^"|"$/g, '').trim()) : line.split(/\t|\s{2,}/);
        const amountMatch = line.match(/-?\$?\d[\d,]*\.\d{2}/);
        if (!amountMatch) return;

        let num = parseFloat(amountMatch[0].replace(/[$,]/g, ''));
        if (line.includes(',') && num > 0) return;
        const amount = Math.abs(num);
        if (amount <= 0) return;

        let date = new Date().toISOString().slice(0, 10);
        const slashDate = line.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (slashDate) {
          date = `${slashDate[3]}-${slashDate[1].padStart(2, '0')}-${slashDate[2].padStart(2, '0')}`;
        }

        let merchant = cols.find(c => c && !/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(c) && !/^(DEBIT|CREDIT|SALE|RETURN)$/i.test(c) && !/^-?\$?\d/.test(c)) || 'Chase Purchase';
        state.transactions.unshift({ id: uid('t'), date, merchant, amount, binId: null });
        added++;
      });

      saveState();
      closeModal();
      showToast(`Imported ${added} purchase(s) into To Bin queue.`);
      render();
    }

    function addNewBin() {
      const name = document.getElementById('new-bin-name').value.trim();
      const budget = parseFloat(document.getElementById('new-bin-bud').value) || 0;
      if (!name) return;
      state.bins.push({ id: uid('bin'), name, budget });
      saveState();
      openEditBinsModal();
    }

    function saveBinsEdits() {
      document.querySelectorAll('.bin-name-in').forEach(inp => {
        const idx = Number(inp.dataset.idx);
        if (inp.value.trim()) state.bins[idx].name = inp.value.trim();
      });
      document.querySelectorAll('.bin-bud-in').forEach(inp => {
        const idx = Number(inp.dataset.idx);
        state.bins[idx].budget = Math.max(0, parseFloat(inp.value) || 0);
      });
      saveState();
      closeModal();
      render();
    }

    function openAddBillModal() {
      openModal(`
        <h3 style="margin-top:0; font-family:var(--serif); font-size:24px;">Add Bill</h3>
        <div class="form-grid">
          <div class="field"><label>Bill Name</label><input id="b-name" placeholder="e.g. Electric" /></div>
          <div class="field"><label>Amount ($)</label><input id="b-amt" type="number" step="0.01" placeholder="120.00" /></div>
          <div class="field"><label>Due Date</label><input id="b-due" type="date" value="${new Date().toISOString().slice(0,10)}" /></div>
          <div class="field"><label>Frequency</label>
            <select id="b-rec"><option value="true">Monthly Recurring</option><option value="false">One-off</option></select>
          </div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="submitBill()">Save Bill</button>
        </div>
      `);
    }

    function submitBill() {
      const name = document.getElementById('b-name').value.trim();
      const amount = parseFloat(document.getElementById('b-amt').value);
      const dueDate = document.getElementById('b-due').value;
      const recurring = document.getElementById('b-rec').value === 'true';
      if (!name || isNaN(amount) || amount <= 0) return;
      state.bills.push({ id: uid('b'), name, amount, dueDate, recurring, paid: false });
      saveState();
      closeModal();
      render();
    }

    function openAddPaycheckModal() {
      openModal(`
        <h3 style="margin-top:0; font-family:var(--serif); font-size:24px;">Add Paycheck (${formatMonthDisplay(selectedMonth)})</h3>
        <div class="form-grid">
          <div class="field"><label>Label / Date</label><input id="p-label" placeholder="e.g. Paycheck #1" /></div>
          <div class="field"><label>Net Amount ($)</label><input id="p-amt" type="number" step="0.01" placeholder="1650.00" /></div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="submitPaycheck()">Save Paycheck</button>
        </div>
      `);
    }

    function submitPaycheck() {
      const label = document.getElementById('p-label').value.trim();
      const amount = parseFloat(document.getElementById('p-amt').value);
      if (!label || isNaN(amount) || amount <= 0) return;
      state.paychecks.push({ id: uid('p'), month: selectedMonth, label, amount, allocations: [] });
      saveState();
      closeModal();
      render();
    }

    function openAddSplitModal(pId) {
      openModal(`
        <h3 style="margin-top:0; font-family:var(--serif); font-size:24px;">Allocate Paycheck Funds</h3>
        <div class="form-grid">
          <div class="field">
            <label>Target</label>
            <select id="s-target">
              <optgroup label="Bills">
                ${state.bills.map(b => `<option value="bill:${b.id}">${escapeHtml(b.name)} (${fmt(b.amount)})</option>`).join('')}
              </optgroup>
              <optgroup label="Spending Bins">
                ${state.bins.map(b => `<option value="bin:${b.id}">${escapeHtml(b.name)}</option>`).join('')}
              </optgroup>
            </select>
          </div>
          <div class="field">
            <label>Amount ($)</label>
            <input id="s-amt" type="number" step="0.01" placeholder="250.00" />
          </div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="submitSplit('${pId}')">Add Allocation</button>
        </div>
      `);
    }

    function submitSplit(pId) {
      const p = state.paychecks.find(x => x.id === pId);
      if (!p) return;
      const [targetType, targetId] = document.getElementById('s-target').value.split(':');
      const amount = parseFloat(document.getElementById('s-amt').value);
      if (isNaN(amount) || amount <= 0) return;
      p.allocations.push({ id: uid('a'), targetType, targetId, amount });
      saveState();
      closeModal();
      render();
    }

    function openCoverageModal() {
      openModal(`
        <h3 style="margin-top:0; font-family:var(--serif); font-size:24px;">All Bills &amp; Coverage (${formatMonthDisplay(selectedMonth)})</h3>
        ${state.bills.map(b => {
          const covered = getBillCoveredTotal(b.id, selectedMonth);
          const pct = Math.min(100, Math.round((covered / (b.amount || 1)) * 100));
          return `
            <div style="margin-bottom:14px;">
              <div style="display:flex; justify-content:space-between; font-weight:600;">
                <span>${escapeHtml(b.name)} (Due ${b.dueDate})</span>
                <span class="tabular">${fmt(covered)} / ${fmt(b.amount)} (${pct}%)</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            </div>
          `;
        }).join('')}
        <div style="display:flex; justify-content:flex-end; margin-top:16px;">
          <button class="btn btn-primary" onclick="closeModal()">Done</button>
        </div>
      `);
    }

    function openAddDebtModal() {
      openModal(`
        <h3 style="margin-top:0; font-family:var(--serif); font-size:24px;">Add Debt or Loan</h3>
        <div class="form-grid">
          <div class="field"><label>Name</label><input id="d-name" placeholder="e.g. Student Loan" /></div>
          <div class="field"><label>Current Balance ($)</label><input id="d-bal" type="number" step="0.01" placeholder="5000" /></div>
          <div class="field"><label>Interest Rate (APR %)</label><input id="d-apr" type="number" step="0.01" placeholder="6.5" /></div>
          <div class="field"><label>Monthly Payment ($)</label><input id="d-pay" type="number" step="0.01" placeholder="180" /></div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="submitDebt()">Save Debt</button>
        </div>
      `);
    }

    function submitDebt() {
      const name = document.getElementById('d-name').value.trim();
      const balance = parseFloat(document.getElementById('d-bal').value);
      const apr = parseFloat(document.getElementById('d-apr').value) || 0;
      const payment = parseFloat(document.getElementById('d-pay').value);
      if (!name || isNaN(balance) || isNaN(payment) || payment <= 0) return;
      state.debts.push({ id: uid('d'), name, balance, apr, payment });
      saveState();
      closeModal();
      render();
    }

    // JSON Backup & Restore
    function exportBackup() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `binned-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function triggerRestore() {
      document.getElementById('restore-input').click();
    }

    function importBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed.bins && parsed.transactions) {
            state = parsed;
            saveState();
            render();
            showToast('Backup restored successfully.');
          }
        } catch (err) {
          alert('Invalid backup JSON file.');
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
    }

    // Initial boot: render immediately, then pull from cloud if configured
    render();
    if (isCloudConfigured()) {
      pullFromCloud(true);
    }
  </script>
</body>
</html>
