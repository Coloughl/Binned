  <style>
    :root {
      --paper: #f7f3e8;
      --paper-elevated: #fffdf7;
      --paper-muted: #ede6d4;
      --ink: #1b1a17;
      --ink-muted: #575247;
      --rule: #1b1a17;
      --rule-strong: #1b1a17;
      --accent: #1d4e3e;
      --accent-bright: #2a725a;
      --accent-soft: #dcebe4;
      --warn: #c85a28;
      --warn-soft: #fae4d8;
      --gold: #e8b339;
      --gold-soft: #fdf2d0;
      --danger: #b52b27;
      --danger-soft: #fbe0df;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --comic: "Bangers", Impact, "Arial Black", sans-serif;
      --shadow-sm: 2px 2px 0px #1b1a17;
      --shadow-md: 4px 4px 0px #1b1a17;
      --shadow-lg: 6px 6px 0px #1b1a17;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--paper);
      background-image: radial-gradient(rgba(27, 26, 23, 0.085) 1.15px, transparent 1.15px);
      background-size: 14px 14px;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.45;
      overflow-x: hidden;
    }

    .tabular { font-variant-numeric: tabular-nums; font-family: var(--mono); }

    /* Layout Shell */
    .app-shell {
      display: grid;
      grid-template-columns: 265px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--paper-elevated);
      border-right: 3px solid var(--ink);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .brand {
      background: #f6f2e6;
      border: 2.5px solid var(--ink);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      padding: 10px 10px 12px;
      margin-bottom: 18px;
      text-align: center;
    }
    .brand-logo {
      width: 148px;
      height: auto;
      display: block;
      margin: 0 auto 4px;
      border-radius: 6px;
    }
    .brand-sub {
      display: inline-block;
      background: var(--gold);
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      box-shadow: 2px 2px 0px var(--ink);
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 13px;
      border: 2px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
      text-align: left;
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
    }
    .nav-btn:hover {
      background: var(--gold-soft);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--ink);
    }
    .nav-btn.active {
      background: var(--accent);
      color: #fff;
      transform: translate(-1px, -1px);
      box-shadow: var(--shadow-md);
    }

    .badge {
      font-family: var(--mono);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 2px solid var(--ink);
      background: var(--warn);
      color: #fff;
      font-weight: 700;
    }
    .nav-btn.active .badge {
      background: var(--gold);
      color: var(--ink);
    }

    .sidebar-footer {
      border-top: 2px dashed var(--ink);
      padding-top: 14px;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sync-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 9px;
      border-radius: 7px;
      background: var(--paper-muted);
      border: 2px solid var(--ink);
      box-shadow: var(--shadow-sm);
      color: var(--ink);
      margin-bottom: 2px;
    }
    .sync-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1.5px solid var(--ink);
      background: #999;
      display: inline-block;
      margin-right: 6px;
    }
    .sync-dot.online { background: #2ecc71; }
    .sync-dot.syncing { background: var(--gold); }

    .main {
      padding: 26px 34px 64px;
      max-width: 1160px;
      width: 100%;
    }

    /* Header Bar */
    .page-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--paper-elevated);
      border: 2.5px solid var(--ink);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      padding: 16px 20px;
      margin-bottom: 24px;
    }
    .page-title {
      font-family: var(--comic);
      font-size: 34px;
      letter-spacing: 0.04em;
      color: var(--ink);
      text-shadow: 2px 2px 0px var(--gold);
      margin: 0;
      line-height: 1.05;
    }
    .page-meta {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-muted);
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    /* Month Switcher */
    .month-bar {
      display: inline-flex;
      align-items: center;
      background: var(--gold-soft);
      border: 2px solid var(--ink);
      border-radius: 7px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .month-bar button {
      border: none;
      background: transparent;
      padding: 7px 11px;
      font-weight: 800;
      cursor: pointer;
      color: var(--ink);
    }
    .month-bar button:hover { background: var(--gold); }
    .month-label {
      padding: 6px 12px;
      font-weight: 800;
      font-size: 13px;
      border-left: 2px solid var(--ink);
      border-right: 2px solid var(--ink);
      background: var(--paper-elevated);
      min-width: 120px;
      text-align: center;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 800;
      border-radius: 7px;
      border: 2px solid var(--ink);
      background: var(--paper-elevated);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.1s ease;
    }
    .btn:hover:not(:disabled) {
      background: var(--gold-soft);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--ink);
    }
    .btn:active:not(:disabled) {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--ink);
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary {
      background: var(--warn);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: #b34d1f; }
    .btn-accent {
      background: var(--accent);
      color: #fff;
    }
    .btn-accent:hover:not(:disabled) { background: #163d30; }
    .btn-danger-outline {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .btn-danger-outline:hover:not(:disabled) { background: #f7c8c6; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-ghost { background: var(--paper-muted); color: var(--ink); }

    /* Cards & Comic Panels */
    .panel {
      background: var(--paper-elevated);
      border: 2.5px solid var(--ink);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      padding: 18px 20px;
      margin-bottom: 22px;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .panel-title {
      font-family: var(--comic);
      font-size: 21px;
      letter-spacing: 0.04em;
      font-weight: 400;
      margin: 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }
    .stat-box {
      background: var(--paper-elevated);
      border: 2.5px solid var(--ink);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      padding: 14px 16px;
      position: relative;
    }
    .stat-box:nth-child(1) { border-top: 6px solid var(--accent); }
    .stat-box:nth-child(2) { border-top: 6px solid var(--gold); }
    .stat-box:nth-child(3) { border-top: 6px solid var(--warn); }
    .stat-box:nth-child(4) { border-top: 6px solid var(--ink); }
    .stat-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
    }
    .stat-value {
      font-size: 22px;
      font-weight: 700;
      margin-top: 4px;
    }
    .stat-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
      margin-top: 3px;
    }

    /* Queue Items & Bin Pills */
    .queue-item {
      border: 2.5px solid var(--ink);
      background: var(--paper-elevated);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      padding: 15px 18px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .queue-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .queue-merchant {
      font-weight: 800;
      font-size: 16px;
    }
    .queue-date {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
    }
    .queue-amount {
      font-size: 17px;
      font-weight: 700;
      background: var(--gold-soft);
      border: 2px solid var(--ink);
      padding: 2px 9px;
      border-radius: 6px;
      box-shadow: 2px 2px 0px var(--ink);
    }
    .bin-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .bin-pill {
      padding: 6px 13px;
      border-radius: 999px;
      border: 2px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 800;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.1s ease;
    }
    .bin-pill:hover {
      background: var(--accent);
      color: #fff;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--ink);
    }

    /* Progress Bars */
    .bar-track {
      width: 100%;
      height: 11px;
      background: var(--paper-muted);
      border: 2px solid var(--ink);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 7px;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.2s ease;
    }
    .bar-fill.warn { background: var(--gold); }
    .bar-fill.danger { background: var(--danger); }

    /* Bin Grid */
    .bins-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .bin-card {
      border: 2px solid var(--ink);
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      padding: 14px;
      background: var(--paper);
    }

    /* Tables */
    .table-wrap { width: 100%; overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      text-align: left;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink);
      background: var(--paper-muted);
      border-bottom: 2px solid var(--ink);
      padding: 9px 10px;
    }
    td {
      padding: 10px 10px;
      border-bottom: 1.5px solid rgba(27, 26, 23, 0.2);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    .num { text-align: right; }

    /* Plan / Paychecks */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 20px;
      align-items: start;
    }
    .paycheck-card {
      border: 2.5px solid var(--ink);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      padding: 16px;
      background: var(--paper-elevated);
      margin-bottom: 16px;
    }
    .split-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1.5px dashed rgba(27, 26, 23, 0.35);
    }
    .split-row:last-child { border-bottom: none; }

    /* Forms & Modals */
    input, select, textarea {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 10px;
      border: 2px solid var(--ink);
      border-radius: 6px;
      background: var(--paper-elevated);
      color: var(--ink);
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      background: #fff;
      box-shadow: 2px 2px 0px var(--accent);
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-muted);
      margin-bottom: 4px;
    }
    .field input, .field select, .field textarea { width: 100%; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(27, 26, 23, 0.62);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal {
      background: var(--paper-elevated);
      border: 3px solid var(--ink);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      max-width: 580px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
    }
    .modal h3 {
      font-family: var(--comic) !important;
      font-size: 26px;
      letter-spacing: 0.03em;
      text-shadow: 1.5px 1.5px 0px var(--gold);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--gold);
      color: var(--ink);
      border: 2.5px solid var(--ink);
      padding: 11px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: var(--shadow-md);
      z-index: 200;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 800;
      background: var(--gold-soft);
      border: 1.5px solid var(--ink);
    }
    .tag-paid { background: var(--accent-soft); color: var(--accent); border-color: var(--ink); }
    .tag-warn { background: var(--danger-soft); color: var(--danger); border-color: var(--ink); }


    .stamp-audit {
      display: inline-block;
      font-family: var(--comic);
      font-size: 14px;
      letter-spacing: 0.08em;
      color: var(--danger);
      border: 2.5px solid var(--danger);
      border-radius: 5px;
      padding: 1px 8px;
      transform: rotate(-2deg);
      background: var(--danger-soft);
      text-transform: uppercase;
    }
    .stamp-cleared {
      display: inline-block;
      font-family: var(--comic);
      font-size: 14px;
      letter-spacing: 0.08em;
      color: var(--accent);
      border: 2.5px solid var(--accent);
      border-radius: 5px;
      padding: 1px 8px;
      transform: rotate(-2deg);
      background: var(--accent-soft);
      text-transform: uppercase;
    }
    .audit-card {
      border: 2.5px solid var(--ink);
      border-left: 7px solid var(--danger);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      padding: 15px 18px;
      background: var(--paper-elevated);
      margin-bottom: 14px;
    }
    .audit-card.resolved {
      border-left-color: var(--accent);
    }
    .buddy-card {
      border: 2.5px solid var(--ink);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      padding: 16px;
      background: var(--paper-elevated);
      margin-bottom: 14px;
    }

    .hidden { display: none !important; }

    @media (max-width: 820px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        height: auto;
        border-right: none;
        border-bottom: 3px solid var(--ink);
        padding: 14px 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
        margin-bottom: 12px;
        padding: 8px 12px;
      }
      .brand-logo {
        width: 74px;
        margin: 0;
      }
      .nav-list { flex-direction: row; flex-wrap: wrap; }
      .nav-btn { width: auto; padding: 7px 11px; font-size: 13px; }
      .sidebar-footer {
        flex-direction: row;
        flex-wrap: wrap;
        margin-top: 12px;
        padding-top: 10px;
      }
      .main { padding: 18px 14px 60px; }
      .two-col { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>
    const STORAGE_KEY = 'binned_ledger_v2';
    const CLOUD_CFG_KEY = 'binned_supabase_cfg_v2';
    const SIMPLEFIN_CFG_KEY = 'binned_simplefin_cfg_v1';

    // Built-in Supabase backend connection (replace with your project's URL and Publishable/Anon Key)
    const DEFAULT_SUPABASE_URL = 'https://xkcxikafpnwrtrwwmqbq.supabase.co';
    const DEFAULT_SUPABASE_KEY = 'sb_publishable__2wZ2u4EjpJ0R5dtvqvRhA_T6rTDZxy';

    function getCurrentMonthKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    const DEFAULT_STATE = {
      defaultMonthlyIncome: 3300,
      monthlyIncomes: {
        '2026-11': 3300
      },
      bins: [
        { id: 'mtg', name: 'MTG Cards', budget: 120 },
        { id: 'beer', name: 'Beer', budget: 80 },
        { id: 'groceries', name: 'Groceries', budget: 450 },
        { id: 'eating_out', name: 'Eating Out', budget: 200 },
        { id: 'transport', name: 'Transport', budget: 160 },
        { id: 'home', name: 'Home', budget: 150 },
        { id: 'fun', name: 'Fun', budget: 120 }
      ],
      transactions: [
        { id: 't1', date: '2026-11-17', merchant: 'Card Kingdom', amount: 42.50, binId: null },
        { id: 't2', date: '2026-11-16', merchant: 'Keweenaw Brewing Co', amount: 18.50, binId: null },
        { id: 't3', date: '2026-11-16', merchant: 'Econo Foods', amount: 84.20, binId: null },
        { id: 't4', date: '2026-11-12', merchant: 'Local Game Store - Draft', amount: 25.00, binId: 'mtg' },
        { id: 't5', date: '2026-11-10', merchant: 'Econo Foods', amount: 112.40, binId: 'groceries' },
        { id: 't6', date: '2026-11-08', merchant: 'Shell Station', amount: 44.10, binId: 'transport' }
      ],
      bills: [
        { id: 'b1', name: 'Rent', amount: 1150, dueDate: '2026-12-01', recurring: true, paid: false },
        { id: 'b2', name: 'Electric & Gas', amount: 135, dueDate: '2026-11-24', recurring: true, paid: false },
        { id: 'b3', name: 'Internet', amount: 65, dueDate: '2026-11-28', recurring: true, paid: false },
        { id: 'b4', name: 'Auto Insurance', amount: 118, dueDate: '2026-11-20', recurring: true, paid: false }
      ],
      paychecks: [
        {
          id: 'p1',
          month: '2026-11',
          label: 'Paycheck #1 (Nov 15)',

    let state = loadState();
    let cloudCfg = loadCloudCfg();
    let simpleFinCfg = loadSimpleFinCfg();
    let currentTab = 'queue';
    let selectedMonth = getCurrentMonthKey();
    let filterBin = 'all';
    let searchQuery = '';
    let extraDebtPayment = 0;
    let isSyncingBank = false;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (typeof parsed.defaultMonthlyIncome !== 'number') parsed.defaultMonthlyIncome = 0;
          if (!parsed.monthlyIncomes) parsed.monthlyIncomes = {};
          return parsed;
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    function loadCloudCfg() {
      try {
        const raw = localStorage.getItem(CLOUD_CFG_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            username: String(parsed.username || '').trim(),
            password: String(parsed.password || ''),
            email: String(parsed.email || '').trim()
          };
        }
      } catch (e) {}
      return { username: '', password: '', email: '' };
    }

    function loadSimpleFinCfg() {
      try {
        const raw = localStorage.getItem(SIMPLEFIN_CFG_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { accessUrl: '', days: 14 };
    }

    function saveSimpleFinCfg(cfg) {
      simpleFinCfg = {
        accessUrl: String(cfg.accessUrl || '').trim(),
        days: Math.max(1, Math.min(90, Number(cfg.days) || 14))
      };
      localStorage.setItem(SIMPLEFIN_CFG_KEY, JSON.stringify(simpleFinCfg));
    }

    function sanitizeUrl(raw) {
      let s = String(raw || '').trim();
      const mdMatch = s.match(/\[(https?:\/\/[^\]]+)\]/);
      if (mdMatch) s = mdMatch[1];
      return s.replace(/\/$/, '');
    }

    function saveCloudCfg(cfg) {
      cloudCfg = {
        username: String(cfg.username || '').trim(),
        password: String(cfg.password || ''),
        email: String(cfg.email !== undefined ? cfg.email : (cloudCfg.email || '')).trim()
      };
      localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cloudCfg));
      updateSyncUI();
    }

    function getSupabaseUrl() {
      return sanitizeUrl(DEFAULT_SUPABASE_URL);
    }

    function getSupabaseKey() {
      return String(DEFAULT_SUPABASE_KEY || '').trim();
    }

    function hasBuiltInSupabase() {
      const u = getSupabaseUrl();
      const k = getSupabaseKey();
      return Boolean(u && !u.includes('YOUR_PROJECT_ID') && k && !k.includes('YOUR_SUPABASE'));
    }

    async function deriveLedgerKey(username, password) {
      const normUser = String(username || '').trim().toLowerCase();
      const raw = `${normUser}::${String(password || '')}`;
      if (window.crypto && window.crypto.subtle) {
        const enc = new TextEncoder().encode(raw);
        const buf = await window.crypto.subtle.digest('SHA-256', enc);
        const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        return `user_${normUser}_${hex}`;
      }
      return `user_${normUser}_${btoa(unescape(encodeURIComponent(raw)))}`;
    }

    function saveState(skipCloud = false) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateBadges();
      if (!skipCloud && isCloudConfigured()) {
        pushToCloud();
      }
    }

    function isCloudConfigured() {
      return Boolean(hasBuiltInSupabase() && cloudCfg && cloudCfg.username && cloudCfg.password);
    }

    function isSimpleFinConfigured() {
      return Boolean(isCloudConfigured() && simpleFinCfg && simpleFinCfg.accessUrl);
    }

    function getSupabaseHeaders(extra = {}) {
      const key = getSupabaseKey();
      const headers = { 'apikey': key, ...extra };
      if (key && key.startsWith('eyJ')) {
        headers['Authorization'] = `Bearer ${key}`;
      }
      return headers;
    }

    function updateSyncUI(statusOverride) {
      const dot = document.getElementById('sync-dot');
      const txt = document.getElementById('sync-text');
      if (!dot || !txt) return;
      if (!isCloudConfigured()) {
        dot.className = 'sync-dot';
        txt.textContent = hasBuiltInSupabase() ? 'Sign In to Sync' : 'Local Only';
        return;
      }
      if (statusOverride === 'syncing') {
        dot.className = 'sync-dot syncing';
        txt.textContent = 'Syncing...';
      } else if (statusOverride === 'error') {
        dot.className = 'sync-dot';
        txt.textContent = 'Sync Error';
      } else {
        dot.className = 'sync-dot online';
        txt.textContent = escapeHtml(cloudCfg.username);
      }
    }

    let buddyData = {
      loaded: false,
      loading: false,
      friends: [],
      incomingRequests: [],
      outgoingRequests: [],
      buddyProfiles: [],
      auditsReceived: [],
      auditsSent: []
    };

    function buildStrictOverBudgetSnapshot(ym) {
      const overBins = [];
      state.bins.forEach(bin => {
        const budget = Number(bin.budget || 0);
        const txs = state.transactions
          .filter(t => t.binId === bin.id && t.date && t.date.startsWith(ym))
          .sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));

        let running = 0;
        const offendingTxs = [];
        txs.forEach(t => {
          const amt = Number(t.amount || 0);
          running += amt;
          if (running > budget) {
            offendingTxs.push({
              id: t.id,
              date: t.date,
              merchant: t.merchant,
              amount: amt,
              overageAfterTx: Math.round((running - budget) * 100) / 100
            });
          }
        });

        if (running > budget) {
          overBins.push({
            binId: bin.id,
            binName: bin.name,
            budget: budget,
            spent: Math.round(running * 100) / 100,
            overBy: Math.round((running - budget) * 100) / 100,
            offendingTxs
          });
        }
      });
      return { month: ym, overBins };
    }

    async function syncBuddyProfile(ym = getCurrentMonthKey()) {
      if (!isCloudConfigured()) return;
      try {
        const cleanUrl = getSupabaseUrl();
        const derivedKey = await deriveLedgerKey(cloudCfg.username, cloudCfg.password);
        const snapshot = buildStrictOverBudgetSnapshot(ym);
        await fetch(`${cleanUrl}/rest/v1/rpc/upsert_buddy_profile`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({
            p_username: cloudCfg.username.trim().toLowerCase(),
            p_ledger_key: derivedKey,
            p_email: cloudCfg.email || '',
            p_month: ym,
            p_over_budget: snapshot
          })
        });
      } catch (e) {}
    }

    async function loadBuddyHub(silent = false) {
      if (!isCloudConfigured()) return;
      buddyData.loading = true;
      if (!silent && currentTab === 'buddy') render();
      try {
        await syncBuddyProfile(selectedMonth);
        const cleanUrl = getSupabaseUrl();
        const derivedKey = await deriveLedgerKey(cloudCfg.username, cloudCfg.password);
        const res = await fetch(`${cleanUrl}/rest/v1/rpc/get_buddy_hub`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({
            p_username: cloudCfg.username.trim().toLowerCase(),
            p_ledger_key: derivedKey
          })
        });
        if (!res.ok) throw new Error('Buddy hub error: ' + res.status);
        const data = await res.json();
        if (data && !data.error) {
          buddyData.friends = data.friends || [];
          buddyData.incomingRequests = data.incoming_requests || [];
          buddyData.outgoingRequests = data.outgoing_requests || [];
          buddyData.buddyProfiles = data.buddy_profiles || [];
          buddyData.auditsReceived = data.audits_received || [];
          buddyData.auditsSent = data.audits_sent || [];
          buddyData.loaded = true;
        }
      } catch (e) {
        if (!silent) showToast('Could not load Accounti-bin-ity hub. Run the SQL migration in Supabase.');
      } finally {
        buddyData.loading = false;
        updateBadges();
        if (currentTab === 'buddy') render();
      }
    }

    async function pushToCloud() {
      if (!isCloudConfigured()) return;
      updateSyncUI('syncing');
      try {
        const cleanUrl = getSupabaseUrl();
        const derivedKey = await deriveLedgerKey(cloudCfg.username, cloudCfg.password);
        const res = await fetch(`${cleanUrl}/rest/v1/rpc/save_ledger`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({
            p_key: derivedKey,
            p_payload: state
          })
        });
        if (!res.ok) throw new Error('Push failed: ' + res.status);
        await syncBuddyProfile(selectedMonth);
        updateSyncUI('online');
      } catch (e) {
        updateSyncUI('error');
      }
    }

    async function pullFromCloud(silent = false) {
      if (!isCloudConfigured()) return;
      updateSyncUI('syncing');
      try {
        const cleanUrl = getSupabaseUrl();
        const derivedKey = await deriveLedgerKey(cloudCfg.username, cloudCfg.password);
        const res = await fetch(`${cleanUrl}/rest/v1/rpc/get_ledger`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ p_key: derivedKey })
        });
        if (!res.ok) throw new Error('Pull failed: ' + res.status);
        const payload = await res.json();
        if (payload) {
          state = payload;
          if (typeof state.defaultMonthlyIncome !== 'number') state.defaultMonthlyIncome = 0;
          if (!state.monthlyIncomes) state.monthlyIncomes = {};
          saveState(true);
          render();
          if (!silent) showToast(`Signed in as ${cloudCfg.username} — synced latest ledger.`);
        } else {
          await pushToCloud();
          if (!silent) showToast(`Created new cloud ledger for ${cloudCfg.username}.`);
        }
        updateSyncUI('online');
      } catch (e) {
        updateSyncUI('error');
        if (!silent) showToast('Could not connect to Supabase. Check built-in project URL/Key and SQL setup.');
      }
    }

    async function syncSimpleFinNow() {
      if (!isSimpleFinConfigured()) {
        switchTab('settings');
        return;
      }
      if (isSyncingBank) return;
      isSyncingBank = true;
      render();
      try {
        // Ensure latest local state is pushed first so we don't overwrite anything
        await pushToCloud();
        const cleanUrl = getSupabaseUrl();
        const derivedKey = await deriveLedgerKey(cloudCfg.username, cloudCfg.password);
        const res = await fetch(`${cleanUrl}/functions/v1/sync-simplefin`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({
            action: 'sync',
            ledger_key: derivedKey,
            access_url: simpleFinCfg.accessUrl,
            days: simpleFinCfg.days || 14
          })
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          throw new Error(data.error || 'SimpleFIN sync failed');
        }
        if (data.added > 0) {
          await pullFromCloud(true);
          showToast(`Imported ${data.added} new bank purchase${data.added === 1 ? '' : 's'}!`);
        } else {
          showToast('Bank feed up to date — no new purchases.');
        }
      } catch (e) {
        showToast('SimpleFIN Error: ' + e.message);
      } finally {
        isSyncingBank = false;
        render();
      }
    }

    function fmt(n) {
      return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function uid(prefix = 'id') {
      return prefix + '_' + Math.random().toString(36).slice(2, 9);
    }

    function formatMonthDisplay(ym) {
      const [y, m] = ym.split('-').map(Number);
      const d = new Date(y, m - 1, 1);
      return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
    }

    function shiftMonth(delta) {
      const [y, m] = selectedMonth.split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      selectedMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      render();
    }

    function monthSwitcherHtml() {
      return `
        <div class="month-bar">
          <button title="Previous Month" onclick="shiftMonth(-1)">&larr;</button>
          <span class="month-label">${formatMonthDisplay(selectedMonth)}</span>
          <button title="Next Month" onclick="shiftMonth(1)">&rarr;</button>
        </div>
      `;
    }

    function getExpectedIncomeForMonth(ym) {
      if (state.monthlyIncomes && typeof state.monthlyIncomes[ym] === 'number') {
        return state.monthlyIncomes[ym];
      }
      return Number(state.defaultMonthlyIncome || 0);
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.add('hidden'), 3600);
    }

    async function copyFieldText(inputId, label = 'Value') {
      const inp = document.getElementById(inputId);
      const val = inp ? inp.value.trim() : '';
      if (!val) {
        showToast(`Nothing in ${label} to copy yet.`);
        return;
      }
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(val);
          showToast(`${label} copied to clipboard!`);
          return;
        }
      } catch (e) {}

      // Reliable fallback for password fields / iOS / non-secure contexts
      const temp = document.createElement('textarea');
      temp.value = val;
      temp.setAttribute('readonly', '');
      temp.style.position = 'fixed';
      temp.style.opacity = '0';
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      temp.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        showToast(`${label} copied to clipboard!`);
      } catch (err) {
        showToast(`Could not auto-copy — tap Show and copy manually.`);
      }
      document.body.removeChild(temp);
    }

    function toggleSecretField(inputId, btn) {
      const inp = document.getElementById(inputId);
      if (!inp) return;
      if (inp.type === 'password') {
        inp.type = 'text';
        btn.textContent = 'Hide';
      } else {
        inp.type = 'password';
        btn.textContent = 'Show';
      }
    }

    function updateBadges() {
      const unbinned = state.transactions.filter(t => !t.binId).length;
      const badge = document.getElementById('queue-badge');
      badge.textContent = unbinned;
      badge.style.display = unbinned > 0 ? 'inline-block' : 'none';

      const buddyBadge = document.getElementById('buddy-badge');
      if (buddyBadge) {
        const openAudits = (buddyData.auditsReceived || []).filter(a => a.status === 'open').length;
        const pendingReqs = (buddyData.incomingRequests || []).length;
        const totalAlerts = openAudits + pendingReqs;
        buddyBadge.textContent = totalAlerts;
        buddyBadge.style.display = totalAlerts > 0 ? 'inline-block' : 'none';
      }
    }

    // Navigation
    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === tabName);
      });
      if (tabName === 'buddy' && isCloudConfigured()) {
        loadBuddyHub(false);
      }
      render();
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        switchTab(btn.dataset.tab);
      });
    });

    function getBinSpentForMonth(binId, ym) {
      return state.transactions
        .filter(t => t.binId === binId && t.date && t.date.startsWith(ym))
        .reduce((sum, t) => sum + Number(t.amount), 0);
    }

    function assignBin(txId, binId) {
      const tx = state.transactions.find(t => t.id === txId);
      const bin = state.bins.find(b => b.id === binId);
      if (!tx || !bin) return;
      tx.binId = binId;
      const txMonth = (tx.date || selectedMonth).slice(0, 7);
      saveState();
      const left = bin.budget - getBinSpentForMonth(binId, txMonth);
      showToast(`Binned to ${bin.name} (${formatMonthDisplay(txMonth)}). ${fmt(left)} left.`);
      render();
    }

    function unbinTx(txId) {
      const tx = state.transactions.find(t => t.id === txId);
      if (!tx) return;
      tx.binId = null;
      saveState();
      showToast('Moved back to To Bin queue.');
      render();
    }

    function deleteTx(txId) {
      state.transactions = state.transactions.filter(t => t.id !== txId);
      saveState();
      render();
    }

    function clearSampleData() {
      if (!confirm('Clear all sample transactions, bills, paychecks, and debts so you can start with a clean slate? (Your bin categories will be kept.)')) return;
      state.transactions = [];
      state.bills = [];
      state.paychecks = [];
      state.debts = [];
      state.defaultMonthlyIncome = 0;
      state.monthlyIncomes = {};
      saveState();
      showToast('Cleared all sample data. Ready for your real numbers!');
      render();
    }

    // Render Router
    function render() {
      updateBadges();
      updateSyncUI();
      const main = document.getElementById('main-content');
      if (currentTab === 'queue') renderQueue(main);
      else if (currentTab === 'overview') renderOverview(main);
      else if (currentTab === 'plan') renderPlan(main);
      else if (currentTab === 'debts') renderDebts(main);
      else if (currentTab === 'buddy') renderBuddyTab(main);
      else if (currentTab === 'settings') renderSettings(main);
    }

    // 1. TO BIN QUEUE
    function renderQueue(main) {
      const queue = state.transactions
        .filter(t => !t.binId)
        .sort((a, b) => b.date.localeCompare(a.date));

      main.innerHTML = `
        <div class="page-header">
          <div>
            <h2 class="page-title">To Bin Queue</h2>
            <div class="page-meta">${queue.length} purchase${queue.length === 1 ? '' : 's'} waiting for a bin (auto-filed by purchase date)</div>
          </div>
          <div class="header-actions">
            ${isSimpleFinConfigured() ? `
              <button class="btn btn-accent" onclick="syncSimpleFinNow()" ${isSyncingBank ? 'disabled' : ''}>
                ${isSyncingBank ? 'Pulling Bank...' : 'Sync Bank Now'}
              </button>
            ` : `
              <button class="btn" onclick="openSimpleFinModal()">Connect SimpleFIN</button>
            `}
            <button class="btn" onclick="openChaseImportModal()">Import CSV / Paste</button>
            <button class="btn btn-primary" onclick="openAddPurchaseModal()">+ Log Purchase</button>
          </div>
        </div>

        ${queue.length === 0 ? `
          <div class="panel" style="text-align:center; padding: 36px 20px;">
            <div style="font-family:var(--serif); font-size:20px; margin-bottom:6px;">All caught up</div>
            <div style="color:var(--ink-muted); margin-bottom:16px;">Every logged purchase has been assigned to a bin.</div>
            <div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap;">
              ${isSimpleFinConfigured() ? `<button class="btn btn-accent" onclick="syncSimpleFinNow()" ${isSyncingBank ? 'disabled' : ''}>${isSyncingBank ? 'Pulling Bank...' : 'Pull New Bank Purchases'}</button>` : ''}
              <button class="btn btn-primary" onclick="openAddPurchaseModal()">+ Log a Purchase</button>
            </div>
          </div>
        ` : queue.map(tx => `
          <div class="queue-item">
            <div class="queue-top">
              <div>
                <div class="queue-merchant">${escapeHtml(tx.merchant)}</div>

    function toggleBillPaid(billId) {
      const bill = state.bills.find(b => b.id === billId);
      if (!bill) return;
      if (!bill.paid && bill.recurring) {
        const d = new Date(bill.dueDate + 'T00:00:00');
        d.setMonth(d.getMonth() + 1);
        bill.dueDate = d.toISOString().slice(0, 10);
        showToast(`${bill.name} marked paid and rolled to ${bill.dueDate}.`);
      } else {
        bill.paid = !bill.paid;
      }
      saveState();
      render();
    }

    function deleteBill(billId) {
      state.bills = state.bills.filter(b => b.id !== billId);
      state.paychecks.forEach(p => {
        p.allocations = p.allocations.filter(a => !(a.targetType === 'bill' && a.targetId === billId));
      });
      saveState();
      render();
    }

    function deletePaycheck(pId) {
      state.paychecks = state.paychecks.filter(p => p.id !== pId);
      saveState();
      render();
    }

    function removeSplit(pId, aId) {
      const p = state.paychecks.find(x => x.id === pId);
      if (!p) return;
      p.allocations = p.allocations.filter(a => a.id !== aId);
      saveState();
      render();
    }

    function coverRestOnLine(pId, aId) {
      const p = state.paychecks.find(x => x.id === pId);
      if (!p) return;
      const line = p.allocations.find(a => a.id === aId);
      if (!line || line.targetType !== 'bill') return;
      const bill = state.bills.find(b => b.id === line.targetId);
      if (!bill) return;

      const assigned = p.allocations.reduce((s, a) => s + Number(a.amount), 0);
      const paycheckLeft = Math.max(0, Number(p.amount) - assigned);
      const billRemaining = Math.max(0, Number(bill.amount) - getBillCoveredTotal(bill.id, selectedMonth));
      const add = Math.min(paycheckLeft, billRemaining);

      if (add > 0) {
        line.amount = Number(line.amount) + add;
        saveState();
        showToast(`Added ${fmt(add)} to cover ${bill.name}.`);
        render();
      }
    }

    function coverBillsFirst(pId) {
      const p = state.paychecks.find(x => x.id === pId);
      if (!p) return;
      let assigned = p.allocations.reduce((s, a) => s + Number(a.amount), 0);
      let left = Number(p.amount) - assigned;
      if (left <= 0) {
        showToast('No remaining funds on this paycheck.');
        return;
      }

      const sortedBills = [...state.bills].filter(b => !b.paid).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
      let addedCount = 0;

      for (const bill of sortedBills) {
        if (left <= 0) break;
        const covered = getBillCoveredTotal(bill.id, selectedMonth);
        const needed = Number(bill.amount) - covered;
        if (needed > 0) {
          const put = Math.min(left, needed);
          const existing = p.allocations.find(a => a.targetType === 'bill' && a.targetId === bill.id);
          if (existing) existing.amount = Number(existing.amount) + put;
          else p.allocations.push({ id: uid('a'), targetType: 'bill', targetId: bill.id, amount: put });
          left -= put;
          addedCount++;
        }
      }

      saveState();
      showToast(addedCount > 0 ? `Allocated funds across ${addedCount} uncovered bill(s).` : 'All unpaid bills are already covered!');
      render();
    }

    // 4. DEBTS & LOANS CALCULATOR
    function calculatePayoff(balance, apr, monthlyPayment) {
      if (balance <= 0) return { months: 0, totalInterest: 0, underwater: false, payoffDate: 'Paid off' };
      const r = (apr / 100) / 12;
      if (r > 0 && monthlyPayment <= balance * r) {
        return { months: Infinity, totalInterest: Infinity, underwater: true, payoffDate: 'Never' };
      }
      let bal = balance;
      let months = 0;
      let totalInterest = 0;
      while (bal > 0.005 && months < 1200) {
        const interest = bal * r;
        totalInterest += interest;
        bal = bal + interest - monthlyPayment;
        months++;
      }
      const d = new Date();
      d.setMonth(d.getMonth() + months);
      const payoffDate = d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
      return { months, totalInterest, underwater: false, payoffDate };
    }

            <div style="display:flex; align-items:center; gap:8px; margin-top:6px;">
              <span>+$</span>

        ${state.debts.length === 0 ? `

          const res = calculatePayoff(Number(d.balance), Number(d.apr), Number(d.payment) + simExtra);
          const yrs = Math.floor(res.months / 12);
          const mos = res.months % 12;
          const durationText = res.underwater ? 'Never (payment too low)' :
            `${yrs > 0 ? yrs + ' yr ' : ''}${mos} mo`;

          return `
            <div class="panel">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
                <div>
                  <div style="font-size:18px; font-weight:700;">${escapeHtml(d.name)}</div>

                    Balance: <strong>${fmt(d.balance)}</strong> &bull; APR: <strong>${d.apr}%</strong> &bull; Payment: <strong>${fmt(Number(d.payment) + simExtra)}/mo</strong>

              ` : `
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-top:14px; padding-top:12px; border-top:1px solid var(--rule);">

    async function sendBuddyRequest() {
      const inp = document.getElementById('buddy-req-username');
      const target = (inp ? inp.value : '').trim().toLowerCase();
      if (!target) return alert('Enter a username first.');
      if (target === cloudCfg.username.trim().toLowerCase()) return alert('You cannot add yourself as a Bin Buddy.');

      try {
        const cleanUrl = getSupabaseUrl();
        const derivedKey = await deriveLedgerKey(cloudCfg.username, cloudCfg.password);
        const res = await fetch(`${cleanUrl}/rest/v1/rpc/send_buddy_request`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({
            p_username: cloudCfg.username.trim().toLowerCase(),
            p_ledger_key: derivedKey,
            p_target_username: target
          })
        });
        const data = await res.json();
        if (!res.ok || (data && data.error)) {
          throw new Error((data && data.error) || 'Could not send request');
        }
        inp.value = '';
        showToast(`Bin Buddy request sent to ${target}!`);
        await loadBuddyHub(true);
      } catch (e) {
        alert(e.message);
      }
    }

    async function respondBuddyRequest(requestId, action) {
      try {
        const cleanUrl = getSupabaseUrl();
        const derivedKey = await deriveLedgerKey(cloudCfg.username, cloudCfg.password);
        const res = await fetch(`${cleanUrl}/rest/v1/rpc/respond_buddy_request`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({
            p_username: cloudCfg.username.trim().toLowerCase(),
            p_ledger_key: derivedKey,
            p_request_id: requestId,
            p_status: action
          })
        });
        if (!res.ok) throw new Error('Failed to update request');
        showToast(action === 'accepted' ? 'Bin Buddy added!' : 'Request declined.');
        await loadBuddyHub(true);
      } catch (e) {
        alert(e.message);
      }
    }

    async function submitAudit(targetUsername, targetEmail, month, binName, txId, merchant, amount, txDate) {
      const btn = document.getElementById('confirm-audit-btn');
      const note = (document.getElementById('audit-note-input').value || '').trim();
      btn.disabled = true;
      btn.textContent = 'Auditing...';

      try {
        const cleanUrl = getSupabaseUrl();
        const derivedKey = await deriveLedgerKey(cloudCfg.username, cloudCfg.password);
        const res = await fetch(`${cleanUrl}/rest/v1/rpc/create_bin_audit`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({
            p_auditor_username: cloudCfg.username.trim().toLowerCase(),
            p_ledger_key: derivedKey,
            p_target_username: targetUsername,
            p_month: month,
            p_bin_name: binName,
            p_tx_id: txId,
            p_merchant: merchant,
            p_amount: amount,
            p_tx_date: txDate,
            p_auditor_note: note
          })
        });
        const data = await res.json();
        if (!res.ok || (data && data.error)) {
          throw new Error((data && data.error) || 'Could not create audit');
        }

        let emailMsg = '';
        if (targetEmail) {
          try {
            const mailRes = await fetch(`${cleanUrl}/functions/v1/notify-audit`, {
              method: 'POST',
              headers: getSupabaseHeaders({ 'Content-Type': 'application/json' }),
              body: JSON.stringify({
                to_email: targetEmail,
                target_username: targetUsername,
                auditor_username: cloudCfg.username.trim(),
                bin_name: binName,
                merchant: merchant,
                amount: amount,
                tx_date: txDate,
                auditor_note: note
              })
            });
            if (mailRes.ok) emailMsg = ' Email notification sent!';
          } catch (mailErr) {}
        }

        closeModal();
        showToast(`Audit issued to ${targetUsername}!${emailMsg}`);
        await loadBuddyHub(true);
      } catch (e) {
        alert(e.message);
        btn.disabled = false;
        btn.textContent = 'Send Audit & Email Alert';
      }
    }

    async function submitAuditDefense(auditId) {
      const inp = document.getElementById(`excuse-input-${auditId}`);

      try {
        const cleanUrl = getSupabaseUrl();

        const res = await fetch(`${cleanUrl}/rest/v1/rpc/resolve_bin_audit`, {

            p_username: cloudCfg.username.trim().toLowerCase(),
            p_ledger_key: derivedKey,
            p_audit_id: auditId,
            p_defense_note: defense
          })
        });
        if (!res.ok) throw new Error('Could not submit defense');
        showToast('Audit justification filed!');
        await loadBuddyHub(true);
      } catch (e) {
        alert(e.message);
      }
    }

    function deleteBinFromSettings(binId) {
      const bin = state.bins.find(b => b.id === binId);
      if (!bin) return;
      if (!confirm(`Remove the "${bin.name}" bin? Any transactions in this bin will return to the To Bin queue.`)) return;
      state.bins = state.bins.filter(b => b.id !== binId);
      state.transactions.forEach(t => {
        if (t.binId === binId) t.binId = null;
      });
      state.paychecks.forEach(p => {
        p.allocations = p.allocations.filter(a => !(a.targetType === 'bin' && a.targetId === binId));
      });
      saveState();
      showToast(`Removed "${bin.name}" bin.`);
      render();
    }

    function handleCsvUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        document.getElementById('chase-paste').value = reader.result;
      };
      reader.readAsText(file);
    }

    function parsePastedChase() {
      const raw = document.getElementById('chase-paste').value.trim();
      if (!raw) return;
      const lines = raw.split(/\r?\n/);
      let added = 0;

      lines.forEach(line => {
        if (!line.trim() || /transaction date|details|description/i.test(line)) return;
        const cols = line.includes(',') ? line.split(',').map(c => c.replace(/^"|"$/g, '').trim()) : line.split(/\t|\s{2,}/);
        const amountMatch = line.match(/-?\$?\d[\d,]*\.\d{2}/);
        if (!amountMatch) return;

        let num = parseFloat(amountMatch[0].replace(/[$,]/g, ''));
        if (line.includes(',') && num > 0) return;
        const amount = Math.abs(num);
        if (amount <= 0) return;

        let date = new Date().toISOString().slice(0, 10);
        const slashDate = line.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (slashDate) {
          date = `${slashDate[3]}-${slashDate[1].padStart(2, '0')}-${slashDate[2].padStart(2, '0')}`;
        }

        let merchant = cols.find(c => c && !/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(c) && !/^(DEBIT|CREDIT|SALE|RETURN)$/i.test(c) && !/^-?\$?\d/.test(c)) || 'Chase Purchase';
        state.transactions.unshift({ id: uid('t'), date, merchant, amount, binId: null });
        added++;
      });

      saveState();
      closeModal();
      showToast(`Imported ${added} purchase(s) into To Bin queue.`);
      render();
    }

      state.paychecks.push({ id: uid('p'), month: selectedMonth, label, amount, allocations: [] });
      saveState();
      closeModal();
      render();
    }

    function openAddSplitModal(pId) {
      openModal(`
        <h3 style="margin-top:0; font-family:var(--serif);">Allocate Paycheck Funds</h3>
        <div class="form-grid">
          <div class="field">
            <label>Target</label>
            <select id="s-target">
              <optgroup label="Bills">
                ${state.bills.map(b => `<option value="bill:${b.id}">${escapeHtml(b.name)} (${fmt(b.amount)})</option>`).join('')}
              </optgroup>
              <optgroup label="Spending Bins">
                ${state.bins.map(b => `<option value="bin:${b.id}">${escapeHtml(b.name)}</option>`).join('')}
              </optgroup>
            </select>
          </div>
          <div class="field">
            <label>Amount ($)</label>
            <input id="s-amt" type="number" step="0.01" placeholder="250.00" />
          </div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="submitSplit('${pId}')">Add Allocation</button>
        </div>
      `);
    }

    function submitSplit(pId) {
      const p = state.paychecks.find(x => x.id === pId);
      if (!p) return;
      const [targetType, targetId] = document.getElementById('s-target').value.split(':');
      const amount = parseFloat(document.getElementById('s-amt').value);
      if (isNaN(amount) || amount <= 0) return;
      p.allocations.push({ id: uid('a'), targetType, targetId, amount });
      saveState();
      closeModal();
      render();
    }

    function openCoverageModal() {
      openModal(`
        <h3 style="margin-top:0; font-family:var(--serif);">All Bills &amp; Coverage (${formatMonthDisplay(selectedMonth)})</h3>
        ${state.bills.map(b => {
          const covered = getBillCoveredTotal(b.id, selectedMonth);
          const pct = Math.min(100, Math.round((covered / (b.amount || 1)) * 100));
          return `
            <div style="margin-bottom:14px;">
              <div style="display:flex; justify-content:space-between; font-weight:600;">
                <span>${escapeHtml(b.name)} (Due ${b.dueDate})</span>
                <span class="tabular">${fmt(covered)} / ${fmt(b.amount)} (${pct}%)</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            </div>
          `;
        }).join('')}
        <div style="display:flex; justify-content:flex-end; margin-top:16px;">
          <button class="btn btn-primary" onclick="closeModal()">Done</button>
        </div>
      `);
    }

    function openAddDebtModal() {
      openModal(`
        <h3 style="margin-top:0; font-family:var(--serif);">Add Debt or Loan</h3>
        <div class="form-grid">
          <div class="field"><label>Name</label><input id="d-name" placeholder="e.g. Student Loan" /></div>
          <div class="field"><label>Current Balance ($)</label><input id="d-bal" type="number" step="0.01" placeholder="5000" /></div>
          <div class="field"><label>Interest Rate (APR %)</label><input id="d-apr" type="number" step="0.01" placeholder="6.5" /></div>
          <div class="field"><label>Monthly Payment ($)</label><input id="d-pay" type="number" step="0.01" placeholder="180" /></div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="submitDebt()">Save Debt</button>
        </div>
      `);
    }

    function submitDebt() {
      const name = document.getElementById('d-name').value.trim();
      const balance = parseFloat(document.getElementById('d-bal').value);
      const apr = parseFloat(document.getElementById('d-apr').value) || 0;
      const payment = parseFloat(document.getElementById('d-pay').value);
      if (!name || isNaN(balance) || isNaN(payment) || payment <= 0) return;
      state.debts.push({ id: uid('d'), name, balance, apr, payment });
      saveState();
      closeModal();
      render();
    }

    // JSON Backup & Restore
    function exportBackup() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `binned-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function triggerRestore() {
      document.getElementById('restore-input').click();
    }

    function importBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed.bins && parsed.transactions) {
            state = parsed;
            saveState();
            render();
            showToast('Backup restored successfully.');
          }
        } catch (err) {
          alert('Invalid backup JSON file.');
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
    }

    // Initial boot: render immediately, then pull from cloud if configured
    render();
    if (isCloudConfigured()) {
      pullFromCloud(true).then(() => loadBuddyHub(true));
    }
  </script>
</body>
</html>
